# Cloudflare Pages configuration.
#
# When `pages_build_output_dir` is present, Cloudflare Pages treats this file as
# the source of truth for bindings (locking the Bindings section in the
# dashboard). Binding D1 (`DB` -> `codepilot-db`) directly here means every
# deployment automatically has storage wired up without extra dashboard clicks.

name = "codepilot-cloudflare"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"                    # must stay "DB" — the code reads env.DB
database_name = "codepilot-db"
database_id = "88ad30cf-247a-4f66-af1d-b2d5a7722167"

# Optional: real code execution. Uncomment after creating the Sandbox Durable
# Object (see SETUP.md §7). Without it, run_command is a clearly-labelled
# virtual shell.
# [[durable_objects.bindings]]
# name = "SANDBOX"
# class_name = "Sandbox"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["Sandbox"]

# Secrets in the Cloudflare dashboard (Settings -> Variables and secrets):
#   MODEL_API_KEY      Secret     provider key            (required)
#   DEV_ACCESS_EMAIL   Secret     single-tenant login email
#   SESSION_SECRET     Secret     optional (derived from MODEL_API_KEY if omitted)
#   MODEL_NAME         Secret     optional (default: claude-sonnet-5-5)
#   CONTEXT_BUDGET_TOKENS Secret  optional (default: 24000)
#   ACCESS_ALLOWED_EMAILS Secret  optional comma-separated allow-list
#
# Note: because `pages_build_output_dir` is set, Cloudflare Pages only allows
# adding encrypted Secrets in the dashboard — every runtime setting works
# identically when saved as a Secret.
